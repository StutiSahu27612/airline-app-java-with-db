# # .gitlab-ci.yml


stages:
  - build
  - test

# Use Maven with OpenJDK 17 from Eclipse Temurin
image: maven:3.8.6-eclipse-temurin-17

variables:
  DB_URL: $DB_URL
  DB_USER: $DB_USER
  DB_PASSWORD: $DB_PASSWORD
  GCP_PROJECT_ID: maximal-brace-436007-t5
  GCP_WORKLOAD_IDENTITY_PROVIDER: "projects/maximal-brace-436007-t5/locations/global/workloadIdentityPools/airline-app-java-wif"
  SERVICE_ACCOUNT_EMAIL: airline-app-java@maximal-brace-436007-t5.iam.gserviceaccount.com


before_script:
  # Install Google Cloud SDK
  - apt-get update && apt-get install -y apt-transport-https ca-certificates gnupg
  - echo "deb https://packages.cloud.google.com/apt cloud-sdk main" | tee -a /etc/apt/sources.list.d/google-cloud-sdk.list
  - curl https://packages.cloud.google.com/apt/doc/apt-key.gpg | apt-key add -
  - apt-get update && apt-get install -y google-cloud-sdk
  
  # Set project and service account using the integrated Workload Identity Federation
  - gcloud config set project $GCP_PROJECT_ID
  - gcloud config set account $SERVICE_ACCOUNT_EMAIL

# Build Job
build:
  stage: build
  script: 
    - mvn clean compile
  artifacts:
    paths:
      - target/

# Test Job
test:
  stage: test
  script:
    - echo "Connecting to GCP MySQL instance..."
    - mvn test -X
