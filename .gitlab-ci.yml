#############################################################################################








stages:
  - build
  - test
  - push
  - deploy 
  - secret_detection


image: maven:3.8.6-eclipse-temurin-17 #I am using maven image with openjdk 17 

variables:
  IMAGE_TAG: $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA
  GOOGLE_ARTIFACT_REGISTRY_REPOSITORY_LOCATION: "us-central1"  
  GOOGLE_ARTIFACT_REGISTRY_PROJECT_ID: "maximal-brace-436007-t5"
  GOOGLE_ARTIFACT_REGISTRY_REPOSITORY_NAME: "airlineapp-java-repository"

# include:
#   - template: Jobs/Secret-Detection.gitlab-ci.yml  # Include the secret detection job
# Build Job
build:
  stage: build
  script: 
    - mvn clean package  # This will create the JAR file in the target directory
  artifacts:
    paths:
      - target/airline-app.jar  # Make sure the JAR is available for later stages

# Test Job
test:
  stage: test
  script:
    - mvn test -X

# Push Docker image
push:
  stage: push
  image: docker:20.10.7  # Using  Docker image for this stage
  services:
    - docker:20.10.7-dind 
  # variables:
  #   DOCKER_TLS_CERTDIR: ""  
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login $CI_REGISTRY -u "$CI_REGISTRY_USER" --password-stdin
    - docker build -t $IMAGE_TAG .
    - docker push $IMAGE_TAG

deploy:
  stage: deploy
  script:
    - echo "Deploy stage"
  needs:
    - build

include:
  - template: Jobs/Secret-Detection.gitlab-ci.yml
  - component: gitlab.com/google-gitlab-components/artifact-registry/upload-artifact-registry@main
    inputs:
      stage: deploy
      source: $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA
      target: $GOOGLE_ARTIFACT_REGISTRY_REPOSITORY_LOCATION-docker.pkg.dev/$GOOGLE_ARTIFACT_REGISTRY_PROJECT_ID/$GOOGLE_ARTIFACT_REGISTRY_REPOSITORY_NAME/$CI_PROJECT_NAME:$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA
      

secret_detection:
  stage: secret_detection  # This is the secret detection job from the template


















































