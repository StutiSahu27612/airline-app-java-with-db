apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: airline-app-ingress
  namespace: airline-app
  labels:
    app: airline-management
  annotations:
    # GKE Ingress annotations
    kubernetes.io/ingress.class: "gce"
    # Enable HTTP to HTTPS redirect (optional)
    # kubernetes.io/ingress.allow-http: "false"
    # For managed certificates (optional)
    # networking.gke.io/managed-certificates: "airline-app-cert"
    # For Cloud Armor security policy (optional)
    # cloud.google.com/armor-config: '{"airline-app-service": "airline-security-policy"}'
spec:
  rules:
  - host: airline-app.example.com  # Replace with your domain
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: airline-app-service
            port:
              number: 80
  # Uncomment for HTTPS with TLS
  # tls:
  # - hosts:
  #   - airline-app.example.com
  #   secretName: airline-app-tls
---
# Optional: Managed Certificate for GKE
# apiVersion: networking.gke.io/v1
# kind: ManagedCertificate
# metadata:
#   name: airline-app-cert
#   namespace: airline-app
# spec:
#   domains:
#     - airline-app.example.com
